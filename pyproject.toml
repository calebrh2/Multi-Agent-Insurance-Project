[project]
name = "underwriting"
version = "0.1.0"
description = "Multi-agent insurance underwriting pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
underwriting = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=underwriting --cov-fail-under=100 --cov-report=term-missing"
markers = ["integration: live Ollama calls, excluded from CI"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["underwriting"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.coverage.run]
source = ["underwriting"]
